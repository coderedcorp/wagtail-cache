on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            wagtail: "3.*"
            python: "3.11"
          - wagtail: "4.1.*"
            python: "3.11"
            wagtail: "5.2.*"
          - python: "3.12"
            wagtail: "6.3.*"
          - python: "3.13"
            wagtail: "7.*"
          - python: "3.14"
            wagtail: "8.*"
          - python: "3.15"
            wagtail: "8.*"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: 'CR-QC: Install from local repo'
        run: python -m pip install -r requirements-dev.txt "wagtail==${{ matrix.wagtail }}"

      - name: 'CR-QC: Check migrations'
        run: |
          cd testproject/
          python manage.py makemigrations --check

      - name: 'CR-QC: Run unit tests'
        run: pytest ./testproject/

  lint:
    name: Linters
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 'CR-QC: Install from local repo'
        run: python -m pip install -r requirements-dev.txt

      - name: 'CR-QC: Spell check'
        run: codespell ./docs/ ./wagtailcache/

      - name: 'CR-QC: Static analysis (ruff)'
        run: ruff check .

      - name: 'CR-QC: Format check'
        run: ruff format --check .

      - name: 'CR-QC: Type check (mypy)'
        run: mypy ./wagtailcache/

  docs:
    name: Documentation
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: 'CR-QC: Install from local repo'
        run: python -m pip install -r requirements-dev.txt

      - name: 'CR-QC: Build documentation'
        shell: pwsh
        run: sphinx-build -M html ./docs/ ./docs/_build/ -W
